services:
  - type: web
    name: house-of-dna
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && python seed_data.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: STORE_NAME
        value: "House of DNA"
